name: build and push docker images on Prod

on:
  pull_request:
    branches:
      - prod

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short git commit SHA
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          push: true
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ env.COMMIT_SHORT_SHA }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          push: true
          context: ./backend
          file: ./backend/Dockerfile.prod
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ env.COMMIT_SHORT_SHA }}

      - name: Build and push image service
        uses: docker/build-push-action@v4
        with:
          push: true
          context: ./img
          file: ./img/Dockerfile.prod
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/img:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/img:${{ env.COMMIT_SHORT_SHA }}

      - name: Send webhook to vps
        run: curl https://ops.blog-tamaris.fr/hooks/update
